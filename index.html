<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEIN Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap">
<style>
/*
  Layout concept: a control tower. Left rail (collapsible) for the eight areas,
  a quiet top bar for search, status and account, and a content column that
  reads summary first, detail second.
  Palette comes straight from the TEIN UI kit: crimson, forest green, white, black.
  Light mode is soft warm white with muted crimson and forest green. Dark mode is built on soft charcoal #464646 (Outer space): raised surfaces use it, the page sits a step darker, accents are softened.
*/
:root {
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-body: 'Outfit', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --bg: #F4F4F0;
  --surface: #FFFFFF;
  --surface-2: #F8F8F5;
  --sunken: #EDEDE8;
  --raised: #FFFFFF;
  --line: #E7E6DF;
  --line-strong: #D3D2C9;

  --ink: #1B1C1A;
  --ink-2: #41423E;
  --muted: #6D6F69;
  --faint: #9A9C95;

  --red: #B83A36;
  --red-hover: #9C2D2A;
  --red-text: #B03430;
  --red-tint: #FBECEB;
  --on-red: #FFFFFF;

  --green: #1F6B36;
  --green-hover: #18572C;
  --green-text: #1B6030;
  --green-tint: #E5F0E8;
  --on-green: #FFFFFF;

  --focus: rgba(31, 107, 54, .25);
  --shadow-pop: 0 12px 32px rgba(27, 28, 26, .10);
  --scrim: rgba(27, 28, 26, .40);

  --chart-grid: #ECEBE4;
  --c-green: #1F6B36;
  --c-red: #B83A36;
  --c-ink: #2A2B28;
  --c-mid: #9CC3A8;

  --rail-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #303030;
    --surface: #3A3A3A;
    --surface-2: #404040;
    --sunken: #2B2B2B;
    --raised: #464646;
    --line: #4C4C4C;
    --line-strong: #5E5E5E;
    --ink: #F2F2EF;
    --ink-2: #DADAD6;
    --muted: #B4B4AF;
    --faint: #9A9A95;
    --red: #BC443F;
    --red-hover: #CC554F;
    --red-text: #FF9189;
    --red-tint: rgba(255, 145, 137, .14);
    --green: #2A7F45;
    --green-hover: #33904F;
    --green-text: #7FD497;
    --green-tint: rgba(127, 212, 151, .15);
    --focus: rgba(127, 212, 151, .4);
    --shadow-pop: 0 16px 40px rgba(0, 0, 0, .40);
    --scrim: rgba(0, 0, 0, .5);
    --chart-grid: #4A4A4A;
    --c-green: #6CCB88;
    --c-red: #FF8B83;
    --c-ink: #F2F2EF;
    --c-mid: #4A9C65;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #303030;
  --surface: #3A3A3A;
  --surface-2: #404040;
  --sunken: #2B2B2B;
  --raised: #464646;
  --line: #4C4C4C;
  --line-strong: #5E5E5E;
  --ink: #F2F2EF;
  --ink-2: #DADAD6;
  --muted: #B4B4AF;
  --faint: #9A9A95;
  --red: #BC443F;
  --red-hover: #CC554F;
  --red-text: #FF9189;
  --red-tint: rgba(255, 145, 137, .14);
  --green: #2A7F45;
  --green-hover: #33904F;
  --green-text: #7FD497;
  --green-tint: rgba(127, 212, 151, .15);
  --focus: rgba(127, 212, 151, .4);
  --shadow-pop: 0 16px 40px rgba(0, 0, 0, .40);
  --scrim: rgba(0, 0, 0, .5);
  --chart-grid: #4A4A4A;
  --c-green: #6CCB88;
  --c-red: #FF8B83;
  --c-ink: #F2F2EF;
  --c-mid: #4A9C65;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); }
</style>
