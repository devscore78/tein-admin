<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEIN Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap">
<style>
/*
  Layout concept: a control tower. Left rail (collapsible) for the eight areas,
  a quiet top bar for search, status and account, and a content column that
  reads summary first, detail second.
  Palette comes straight from the TEIN UI kit: crimson, forest green, white, black.
  Dark mode is a warm wood-black (brown-tinted, never grey) with the same red, green and white.
*/
:root {
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-body: 'Outfit', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --bg: #F3F2EC;
  --surface: #FFFFFF;
  --surface-2: #F8F7F2;
  --sunken: #ECEAE2;
  --raised: #FFFFFF;
  --line: #E3E1D7;
  --line-strong: #CDCABD;

  --ink: #121212;
  --ink-2: #3B3A36;
  --muted: #6C695F;
  --faint: #9A978B;

  --red: #B30000;
  --red-hover: #8F0000;
  --red-text: #B30000;
  --red-tint: #FBE9E8;
  --on-red: #FFFFFF;

  --green: #0B4A14;
  --green-hover: #083A10;
  --green-text: #0B4A14;
  --green-tint: #E2EEE4;
  --on-green: #FFFFFF;

  --focus: rgba(11, 74, 20, .28);
  --shadow-pop: 0 14px 36px rgba(18, 18, 18, .16);
  --scrim: rgba(18, 16, 12, .48);

  --chart-grid: #E8E6DC;
  --c-green: #0B4A14;
  --c-red: #B30000;
  --c-ink: #1A1A1A;
  --c-mid: #8DB69A;

  --rail-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0A08;
    --surface: #16110E;
    --surface-2: #1B1511;
    --sunken: #241C17;
    --raised: #352C25;
    --line: #2A221C;
    --line-strong: #43372E;
    --ink: #F3EDE5;
    --ink-2: #D6CDC2;
    --muted: #A5998D;
    --faint: #76695F;
    --red: #CC2F27;
    --red-hover: #E0453C;
    --red-text: #FF7469;
    --red-tint: rgba(255, 116, 105, .13);
    --green: #1F7A38;
    --green-hover: #278F44;
    --green-text: #6ACB86;
    --green-tint: rgba(106, 203, 134, .13);
    --focus: rgba(106, 203, 134, .4);
    --shadow-pop: 0 18px 44px rgba(0, 0, 0, .65);
    --scrim: rgba(0, 0, 0, .62);
    --chart-grid: #261E19;
    --c-green: #5FBF7B;
    --c-red: #FF6A5E;
    --c-ink: #F3EDE5;
    --c-mid: #3F8556;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0A08;
  --surface: #16110E;
  --surface-2: #1B1511;
  --sunken: #241C17;
  --raised: #352C25;
  --line: #2A221C;
  --line-strong: #43372E;
  --ink: #F3EDE5;
  --ink-2: #D6CDC2;
  --muted: #A5998D;
  --faint: #76695F;
  --red: #CC2F27;
  --red-hover: #E0453C;
  --red-text: #FF7469;
  --red-tint: rgba(255, 116, 105, .13);
  --green: #1F7A38;
  --green-hover: #278F44;
  --green-text: #6ACB86;
  --green-tint: rgba(106, 203, 134, .13);
  --focus: rgba(106, 203, 134, .4);
  --shadow-pop: 0 18px 44px rgba(0, 0, 0, .65);
  --scrim: rgba(0, 0, 0, .62);
  --chart-grid: #261E19;
  --c-green: #5FBF7B;
  --c-red: #FF6A5E;
  --c-ink: #F3EDE5;
  --c-mid: #3F8556;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); }
</style>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">

</head>

</body>
</html>
